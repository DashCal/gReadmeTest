<svg xmlns="http://www.w3.org/2000/svg" width="1729" height="577" viewBox="0 0 1729 577" overflow="hidden"><style xmlns="http://www.w3.org/2000/svg">:root{--has-force:0;--force-lang:1;--enable-switch:1;--enable-target:1;--font:Mona Sans,Mona Sans VF,Geist,IBM Plex Sans,Inter Display,Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,Noto Sans Backtick Fix,Noto Sans,Source Han Sans,Noto Sans CN,Source Han Sans CN,Noto Sans SC,Source Han Sans SC,Noto Sans TC,Source Han Sans TC,Noto Sans CJK,Source Han Sans CJK,sans-serif,'Apple Color Emoji','Segoe UI Emoji';font-variant-ligatures:none;--text-main-size:60px;--text-main-x:50%;--text-main-y:65%;--clr:#000;--tm-y:35%}.text-pos{transform-box:view-box;transform:translate(var(--text-main-x),var(--text-main-y))}.tm-pos{transform-box:view-box;transform-origin:center center;transform:translate(var(--text-main-x),var(--tm-y))}.trademark{transform-box:fill-box;transform-origin:center center}@media (prefers-color-scheme:dark){:root{--clr:#fff}}@media (max-width:679.98px){:root{--text-main-size:80px;--text-main-x:5px;--text-main-y:65%}.slogan{text-anchor:start}.trademark{transform-origin:left center;transform:translateX(calc(50%)) scale(1.25)}}.force-en{opacity:calc(var(--has-force) * var(--force-lang))}.force-zh{opacity:calc(var(--has-force) * (1 - var(--force-lang)))}.default-en{opacity:calc((1 - var(--enable-switch)) * var(--enable-target) * (1 - var(--has-force)))}.env-layer{opacity:calc(var(--enable-switch) * (1 - var(--has-force)))}#en:target ~ .content .env-layer,#zh:target ~ .content .env-layer{opacity:calc(var(--enable-switch) * (1 - var(--enable-target)) * (1 - var(--has-force)))}.anchor-en,.anchor-zh{opacity:0}#en:target ~ .content .default-en,#zh:target ~ .content .default-en{opacity:0}#en:target ~ .content .anchor-en{opacity:calc(var(--enable-target) * (1 - var(--has-force)))}#zh:target ~ .content .anchor-zh{opacity:calc(var(--enable-target) * (1 - var(--has-force)))}</style><g id="en"></g><g id="zh"></g><